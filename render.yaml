# Render 部署配置
#
# 用法：把本仓库推到 GitHub 后，在 Render 选择
#   New → Blueprint → 选中本仓库
# Render 会自动读取本文件创建服务。
#
# 若手动创建 Web Service，请填写：
#   Build Command : pip install -r requirements.txt
#   Start Command : uvicorn src.main:app --host 0.0.0.0 --port $PORT

services:
  - type: web
    name: calculator-backend
    runtime: python
    plan: free
    region: singapore          # 离国内较近，冷启动延迟略低
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RELOAD
        value: "false"
      # 部署前端后，把下面的值改成真实的前端地址（逗号分隔可填多个）
      - key: CORS_ALLOW_ORIGINS
        value: "*"
